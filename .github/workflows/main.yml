name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # ✅ Install dependencies langsung
      - name: Install dependencies
        run: npm install

      # ✅ Masuk ke folder scripts & install kalau perlu
      - name: Install script dependencies
        run: |
          cd scripts
          npm install || true

      # ✅ Create Identity
      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      # ✅ Link Human ke Agent
      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"basiro561","description":"basiro561 AI Agent"}'

name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # ✅ LANGSUNG KE FOLDER scripts
      - name: Install dependencies
        run: |
          cd scripts
          npm install

      # ✅ Create Identity
      - name: Create Ethereum Identity
        run: |
          cd scripts
          node createNewEthereumIdentity.js

      # ✅ Link Human ke Agent
      - name: Link Human to Agent
        run: |
          cd scripts
          node manualLinkHumanToAgent.js --challenge '{"name":"basiro561","description":"basiro561 AI Agent"}'
